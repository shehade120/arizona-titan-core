<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Wear | Arizona Titan</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Montserrat', sans-serif; }
        .hero { padding: 100px 20px; text-align: center; border-bottom: 1px solid #333; }
        h1 { color: #D4AF37; font-family: 'Cinzel', serif; font-size: 3rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 50px; }
        .item { background: #1a1a1a; padding: 20px; border: 1px solid #333; }
        img { width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>TITAN WEAR</h1>
        <p>Identidad estratégica urbana.</p>
    </div>
    <div class="grid">
        <div class="item">
            <img src="../images/asset_2.jpg" alt="Titan Wear">
            <h3>Titan Signature Hoodie</h3>
            <p>$89.00</p>
        </div>
        <div class="item">
            <img src="../images/asset_4.jpg" alt="Titan Gear">
            <h3>Titan Tactical Tee</h3>
            <p>$45.00</p>
        </div>
    </div>
</body>
</html>
