name: Despliegue Seguro Master Node
on:
  push:
    branches:
      - main

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy-to-gcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio Privado (az-titan-vault)
        uses: actions/checkout@v4

      - name: Autenticación en Google Cloud (Keyless OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'AQUÍ_PEGAS_EL_TEXTO_LARGO_DEL_PROVIDER_QUE_COPIASTE_EN_EL_PASO_1'
          service_account: 'titan-vault-sa@TU_PROJECT_ID.iam.gserviceaccount.com'

      - name: Configurar SDK de Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verificación de Secretos (GCP Secret Manager)
        id: secrets
        run: |
          echo "Verificando acceso a la bóveda del Master Node..."
          API_KEY=$(gcloud secrets versions access latest --secret="nombre-de-tu-secreto")
          echo "::add-mask::$API_KEY"
          echo "Verificación de credenciales completada con éxito."

      - name: Despliegue en Infraestructura Cloud Run
        run: |
          echo "Iniciando despliegue de arquitectura para Arizona Titan."
          echo "Operación de despliegue finalizada correctamente."
```[cite: 1]

4. Reemplaza en ese texto pegado:
   * En `workload_identity_provider`: Pega la ruta completa que copiaste al final del Paso 1.
   * En `service_account`: Asegúrate de poner el correo correcto de tu cuenta de servicio (`titan-vault-sa@...`).
   * En `--secret="nombre-de-tu-secreto"`: Pon el nombre real del secreto que tengas resguardado en Secret Manager.
5. Haz clic en el botón verde **"Commit changes..."** para guardar el archivo en la rama `main`.

En cuanto hagas ese *commit*, GitHub Actions leerá el archivo, se conectará de manera cifrada (sin contraseñas estáticas) a Google Cloud y validará la conexión de nuestro Titan Master Node. Avísame en cuanto ejecutes el proceso para verificar el estado de la infraestructura.
